<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABOUT ME — YEO SANGHEE</title>
  <link rel="stylesheet" href="about_me.css">
</head>
<body>
  <main class="stage" id="stage">
    <!-- t1.png without the hero area: label, ABOUT ME, left copy, logo -->
    <img class="base" src="imgs/about/base.png" alt="ABOUT ME — UI/UX DESIGNER AND CREATOR, 연륜 + 감각 + AI">

    <!-- hero area (centre character + right text) cut from t1/t2/t3 -->

    <div class="boxes" role="group" aria-label="화면 선택">
      <button type="button" class="box box-1" aria-label="첫 번째 화면" aria-pressed="true"></button>
      <button type="button" class="box box-2" aria-label="두 번째 화면" aria-pressed="false"></button>
      <button type="button" class="box box-3" aria-label="세 번째 화면" aria-pressed="false"></button>

  <script src="about_me.js"></script>
