<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SURVIVING SNIPPETS — YEO SANGHEE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="snippets.css">
</head>
<body>
  <main class="stage" id="stage">
    <p class="site-label">UI/UX DESIGNER AND CREATOR - <b>YEOSANGHEE</b></p>

    <!-- title block: 1280x860 coordinates, like imgs/intro/intro_snippets.jpg (calligraphy overlaps the title) -->
    <h1 class="title">
      <span class="title-about">about</span>
      <span class="title-main">20 YEARS AGO</span>
    </h1>
    <img class="title-script" src="imgs/snippets/calligraphy_snippets.png" alt="Surviving snippets" width="361" height="74">

    <h2 class="subtitle">20여년전에는 이모티콘 하나마저 스스로</h2>
    <p class="desc">
      포트폴리오를 만들 시간도 만들 필요도 없었습니다. 만든 작업물들을 보고 연락이 왔기에...<br>
      많은 일들을 해내기에도 빠듯한 그런 날들이었고, 참으로 보람되고 활기찬, 빛나는 하루하루였습니다.
    </p>

    <!-- carousel: original 1920x1080 design, shown at 2/3 inside the 1280x860 artboard -->
    <div class="board">

    <section class="carousel" aria-roledescription="carousel" aria-label="작업물">
      <ul class="track" id="track"></ul>
      <p class="caption" id="caption" aria-live="polite"></p>
      <button type="button" class="arrow arrow-prev" id="prev" aria-label="이전 작업물">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4 7.5 12l8 8"/></svg>
      </button>
      <button type="button" class="arrow arrow-next" id="next" aria-label="다음 작업물">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8.5 4 8 8-8 8"/></svg>
      </button>
    </section>
    </div>

    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
      <div class="modal-box">
        <h3 class="sr-only" id="modal-title"></h3>
        <div class="modal-scroll" id="modal-scroll">
          <img id="modal-img" alt="">
        </div>
        <button type="button" class="modal-close" id="modal-close" aria-label="닫기">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </div>
  </main>

  <script src="site.js"></script>
  <script src="snippets.js"></script>
</body>
</html>
